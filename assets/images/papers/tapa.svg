  <g>
    <rect x="222" y="26" width="40" height="48" rx="3" fill="#268bd2" opacity="0.8"/>
    <rect x="266" y="26" width="28" height="48" rx="3" fill="#cb4b16" opacity="0.8"/>
    <rect x="298" y="26" width="38" height="48" rx="3" fill="#073642"/>
    <text x="242" y="56" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="15" fill="#fdf6e3" font-weight="600">a&#720;</text>
    <text x="280" y="56" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="15" fill="#fdf6e3" font-weight="600">t</text>
    <text x="317" y="56" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="15" fill="#fdf6e3" font-weight="600">s</text>
  </g>
  <text x="279" y="104" text-anchor="middle" font-family="Source Sans 3, sans-serif" font-size="12" fill="#586e75" font-style="italic">aligned segments</text>

